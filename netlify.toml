[build]
  publish = "."
  command = "node scripts/build-assets.js"

# 1. Immutable content-hashed assets (cached aggressively for 1 year)
[[headers]]
  for = "/assets/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 2. HTML entry points (always revalidate against server for instant invalidation)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Pragma = "no-cache"

# 3. Unversioned fallback assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
