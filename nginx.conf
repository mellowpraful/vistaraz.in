# Nginx Server Configuration for Vistaraz Production

server {
    listen 80;
    server_name vistaraz.com www.vistaraz.com;
    root /var/www/vistaraz;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 1. Content-Hashed Immutable Assets: Cache for 1 Year
    location ~* ^/assets/dist/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 2. HTML Files & Root: Must Revalidate (Instant Invalidation on Deployment)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Pragma "no-cache";
        etag on;
    }

    # Root location
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Pragma "no-cache";
        etag on;
    }

    # 3. Unversioned Static Assets Fallback
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        etag on;
    }

    # 4. Custom Error Handling
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
    location = /404.html {
        internal;
    }
    location = /500.html {
        internal;
    }
}
